{{define "favorites"}}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes cartes favorites - Hearthstone</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <header class="site-header">
        <nav>
            <ul class="nav-menu">
                <li class="nav-item nav-logo"><a href="/"><img src="/static/img/Hearthstone-Logo.png" alt="Accueil"></a>
                </li>
                <li class="nav-item"><a href="/cards">Cartes</a></li>
                <li class="nav-item"><a href="/cardbacks">Dos de Cartes</a></li>
                <li class="nav-item"><a href="/deck/code">Deck Builder</a></li>
                <li class="nav-item"><a href="/favorites">Favoris</a></li>
            </ul>
        </nav>
    </header>
    <h1>Mes cartes favorites</h1>
    {{if .}}
    <div class="cards-container">
        {{range .}}
        <div class="card">
            <a href="/card?id={{.ID}}"><img src="{{.Image}}" alt="Image de la carte {{.Name}}"></a>
            <form action="/favorites/remove" method="post" class="card-remove-form">
                <input type="hidden" name="id" value="{{.ID}}">
                <button type="submit">Retirer</button>
            </form>
        </div>
        {{end}}
    </div>
    {{else}}
    <p class="text-center mt-20">Aucune carte en favori. Ajoutez des cartes depuis la liste des
        cartes.</p>
    {{end}}
</body>

</html>
{{end}}
