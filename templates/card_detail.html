{{define "card_detail"}}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail carte - {{.Card.Name.FR}}</title>
    <link rel="stylesheet" href="/static/css/style.css">
 </head>

<body>
    <a href="/cards">← Retour à la liste</a>
    <h1>{{.Card.Name.FR}}</h1>
    <p><strong>ID :</strong> {{.Card.ID}}</p>
    <p><strong>Coût en mana :</strong> {{.Card.ManaCost}}</p>
    <p><strong>Attaque :</strong> {{.Card.Attack}}</p>
    <p><strong>Santé :</strong> {{.Card.Health}}</p>
    <p><strong>Rareté :</strong> {{.Card.RarityName}}</p>
    <img src="{{.Card.Image.FR}}" alt="Image de la carte {{.Card.Name.FR}}">

    <form method="post" action="/favorites/add">
        <input type="hidden" name="id" value="{{.Card.ID}}">
        <input type="hidden" name="manaCost" value="{{.Card.ManaCost}}">
        <input type="hidden" name="attack" value="{{.Card.Attack}}">
        <input type="hidden" name="health" value="{{.Card.Health}}">
        <input type="hidden" name="rarity" value="{{.Card.Rarity}}">
        <input type="hidden" name="name" value="{{.Card.Name.FR}}">
        <input type="hidden" name="image" value="{{.Card.Image.FR}}">
        <button type="submit">Ajouter aux favoris</button>
    </form>

</body>

</html>
{{end}}
